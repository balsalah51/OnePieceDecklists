name: ingest-lists

on:
  schedule:
    # 11:15 UTC is 07:15 in America/New_York while daylight time is in effect,
    # and 06:15 when standard time is in effect.
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ingest new lists
        env:
          PYTHONUNBUFFERED: "1"
          OPDL_SKIP_PAGE_PATCH: "1"
        run: python3 scripts/ingest-fresh-meta.py
      - name: Report newest hosted list
        run: python3 scripts/check-data-freshness.py
      - name: Report cards missing a TCGplayer id
        run: python3 scripts/report-tcgplayer-gaps.py
      - name: Commit ingested lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ingest made no file changes"
            exit 0
          fi
          git commit -m "Ingest lists"
          git push
