name: discord-bot

on:
  push:
    paths:
      - "discord-bot/**"
      - "data/consensus-decks.json"
      - "scripts/generate-tournament-lists.py"
  pull_request:
    paths:
      - "discord-bot/**"
      - "data/consensus-decks.json"
      - "scripts/generate-tournament-lists.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r discord-bot/requirements.txt
      - run: python -m unittest discover -s discord-bot/tests -v
